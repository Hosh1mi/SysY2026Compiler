<!doctype html>
<!-- Local SysY compiler visualizer: source editor, real pipeline, and IR diff. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysY Pipeline Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1018; --panel:#111925; --panel-2:#0e151f; --line:#263448; --muted:#8291a5; --text:#e9eef5; --cyan:#5dd6db; --amber:#f2bd70; --red:#ef8f9d; --green:#8ed9a3; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { background:var(--bg); color:var(--text); font:13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
    button, select, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { height:100%; display:grid; grid-template-columns:360px minmax(0,1fr); grid-template-rows:58px minmax(0,1fr); }
    header { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--line); background:#0e1622; }
    .brand { display:flex; align-items:center; gap:11px; letter-spacing:.01em; }
    .mark { width:25px; height:25px; display:grid; place-items:center; border:1px solid #4aaeb7; color:var(--cyan); border-radius:6px; font-weight:800; }
    .brand strong { font-size:15px; }
    .brand span { color:var(--muted); margin-left:4px; }
    .toolbar { display:flex; gap:9px; align-items:center; }
    .toolbar label { color:var(--muted); font-size:12px; }
    select, .compile { height:32px; border:1px solid var(--line); border-radius:5px; background:#151f2d; color:var(--text); padding:0 10px; }
    .compile { border-color:#3a9da5; color:#dffeff; background:#16373c; font-weight:700; padding:0 15px; }
    .compile:hover { background:#1c4a50; }
    aside { min-height:0; border-right:1px solid var(--line); display:grid; grid-template-rows:minmax(330px, 46%) minmax(0,1fr); background:var(--panel); }
    .editor-pane, .pipeline-pane { min-height:0; display:flex; flex-direction:column; }
    .section-head { min-height:42px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid var(--line); color:#c8d2df; font-weight:700; }
    .section-head small { color:var(--muted); font-weight:500; }
    .editor-wrap { min-height:0; flex:1; padding:12px; display:flex; }
    textarea { resize:none; flex:1; min-height:0; width:100%; border:1px solid #29384b; border-radius:5px; outline:none; color:#d8e2ed; background:#0a111a; padding:13px 14px; font:12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size:2; }
    textarea:focus { border-color:#478d9a; box-shadow:0 0 0 2px #1c454d55; }
    .pipeline { min-height:0; overflow:auto; padding:8px; }
    .stage-group { margin:5px 0 10px; }
    .group-label { padding:5px 9px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:10px; font-weight:800; }
    .stage { width:100%; min-height:31px; display:flex; align-items:center; gap:8px; padding:5px 9px; border:0; border-radius:4px; color:#bdc8d5; background:transparent; text-align:left; }
    .stage.nested { padding-left:27px; }
    .stage:hover { background:#1b2838; color:#f4f7fa; }
    .stage.active { background:#173b42; color:#e3ffff; }
    .stage.unchanged { color:#68788c; }
    .stage.unchanged .dot { background:#3d4b5c; }
    .stage .dot { width:6px; height:6px; border-radius:50%; background:#5a6b7f; flex:none; }
    .stage.active .dot { background:var(--cyan); box-shadow:0 0 0 3px #5dd6db22; }
    .stage .index { width:25px; color:#65768a; font:11px ui-monospace, monospace; text-align:right; }
    .stage .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    main { min-width:0; min-height:0; display:flex; flex-direction:column; background:#0b111a; }
    .diff-head { min-height:42px; display:flex; align-items:center; justify-content:space-between; padding:0 17px; border-bottom:1px solid var(--line); background:var(--panel-2); }
    .diff-title { display:flex; gap:10px; align-items:baseline; }
    .diff-title strong { font-size:14px; }
    .diff-title span { color:var(--muted); font:11px ui-monospace, monospace; }
    .status { color:var(--muted); font-size:12px; }
    .diff-grid { min-height:0; flex:1; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; }
    .code-pane { min-width:0; overflow:auto; border-right:1px solid var(--line); }
    .code-pane:last-child { border-right:0; }
    .code-label { position:sticky; top:0; z-index:2; padding:8px 13px; border-bottom:1px solid var(--line); background:#101925ee; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.04em; }
    .rows { min-width:max-content; padding:8px 0 30px; font:12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .row { display:grid; grid-template-columns:45px auto; min-height:20px; padding-right:18px; }
    .line-no { user-select:none; text-align:right; padding-right:12px; color:#506177; }
    .line-text { white-space:pre; color:#d5dee9; }
    .row.removed { background:#4b222b66; } .row.removed .line-text { color:#ffb5bd; }
    .row.added { background:#173d3266; } .row.added .line-text { color:#b9f0c4; }
    .row.changed { background:#4b3e2166; } .row.changed .line-text { color:#f8d49b; }
    .empty { height:100%; display:grid; place-items:center; color:var(--muted); padding:30px; text-align:center; }
    .error { color:#ffb5bd; white-space:pre-wrap; font:12px/1.6 ui-monospace, monospace; padding:18px; }
    @media (max-width: 820px) { body { overflow:auto; } .app { height:auto; min-height:100%; grid-template-columns:1fr; grid-template-rows:58px auto auto; } aside { border-right:0; border-bottom:1px solid var(--line); grid-template-rows:390px 360px; } main { min-height:600px; } header { position:sticky; top:0; z-index:4; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="mark">S</div><div><strong>SysY Pipeline Lab</strong></div></div>
      <div class="toolbar"><label for="opt">优化级别</label><select id="opt"><option value="0">-O0</option><option value="1" selected>-O1</option><option value="2">-O2</option><option value="3">-O3</option></select><button class="compile" id="compile">编译并刷新管线</button></div>
    </header>
    <aside>
      <section class="editor-pane"><div class="section-head"><span>SysY source</span><small>Ctrl + Enter 编译</small></div><div class="editor-wrap"><textarea id="source" spellcheck="false">const int n = 8;

int square(int x) {
  return x * x;
}

int main() {
  int sum = 0;
  int i = 0;
  while (i &lt; n) {
    sum = sum + square(i);
    i = i + 1;
  }
  return sum;
}</textarea></div></section>
      <section class="pipeline-pane"><div class="section-head"><span>Compiler pipeline</span><small id="stage-count">等待编译</small></div><div class="pipeline" id="pipeline"><div class="empty">输入源码后点击编译<br>阶段快照会按真实执行顺序出现</div></div></section>
    </aside>
    <main><div class="diff-head"><div class="diff-title"><strong id="diff-name">选择一个阶段</strong><span id="diff-meta">before / after</span></div><div class="status" id="status">就绪</div></div><div class="diff-grid" id="diff"><div class="empty">右侧会显示当前阶段执行前后的代码差异</div><div class="empty">暂未选择阶段</div></div></main>
  </div>
  <script>
    const source = document.querySelector('#source');
    const pipeline = document.querySelector('#pipeline');
    const status = document.querySelector('#status');
    const count = document.querySelector('#stage-count');
    const diff = document.querySelector('#diff');
    const name = document.querySelector('#diff-name');
    const meta = document.querySelector('#diff-meta');
    let stages = [];
    let active = null;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function setStatus(text, error = false) { status.textContent = text; status.style.color = error ? 'var(--red)' : 'var(--muted)'; }
    function renderPipeline() {
      pipeline.innerHTML = '';
      if (!stages.length) { pipeline.innerHTML = '<div class="empty">没有可显示的阶段</div>'; return; }
      const groups = [['mid', 'Middle end'], ['backend', 'Backend']];
      let index = 0;
      for (const [kind, label] of groups) {
        const items = stages.filter(s => s.kind === kind); if (!items.length) continue;
        const group = document.createElement('div'); group.className = 'stage-group'; group.innerHTML = `<div class="group-label">${label}</div>`;
        for (const stage of items) {
          index += 1; const button = document.createElement('button'); button.className = `stage${stage.parent ? ' nested' : ''}${stage.changed === false ? ' unchanged' : ''}`; button.dataset.id = stage.id;
          const suffix = stage.kind === 'mid' && stages.filter(s => s.kind === 'mid' && s.name === stage.name).length > 1 ? ` <span style="color:var(--muted)">#${stage.occurrence + 1}</span>` : '';
          button.innerHTML = `<span class="dot"></span><span class="index">${String(index).padStart(2,'0')}</span><span class="name">${esc(stage.displayName || stage.name)}${suffix}</span>`;
          button.title = stage.changed === false ? '未修改 IR' : '修改了 IR';
          button.onclick = () => selectStage(stage, button); group.appendChild(button);
        }
        pipeline.appendChild(group);
      }
    }
    function renderRows(rows, side) {
      let number = 0; const body = rows.map(row => { const text = side === 'left' ? row.left : row.right; const present = text !== ''; if (present) number += 1; const status = row.status === 'equal' ? '' : ` ${row.status}`; return `<div class="row${status}"><span class="line-no">${present ? number : ''}</span><span class="line-text">${esc(text)}</span></div>`; }).join('');
      return `<div class="rows">${body || '<div class="empty">空</div>'}</div>`;
    }
    function renderDiff(data) {
      name.textContent = data.name || '阶段'; meta.textContent = 'before / after';
      diff.innerHTML = `<div class="code-pane"><div class="code-label">BEFORE</div>${renderRows(data.rows || [], 'left')}</div><div class="code-pane"><div class="code-label">AFTER</div>${renderRows(data.rows || [], 'right')}</div>`;
      const panes = [...diff.querySelectorAll('.code-pane')]; panes[0].addEventListener('scroll', () => panes[1].scrollTop = panes[0].scrollTop); panes[1].addEventListener('scroll', () => panes[0].scrollTop = panes[1].scrollTop);
    }
    async function selectStage(stage, button) {
      active = stage; document.querySelectorAll('.stage.active').forEach(x => x.classList.remove('active')); button.classList.add('active');
      setStatus('正在生成快照…'); name.textContent = stage.name; meta.textContent = 'loading';
      try {
        const response = await fetch('/api/stage', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({source:source.value, opt:Number(document.querySelector('#opt').value), kind:stage.kind, name:stage.name, occurrence:stage.occurrence, phase:stage.phase}) });
        const data = await response.json(); if (!response.ok) throw new Error(data.error || '快照生成失败'); renderDiff(data); setStatus('快照已更新');
      } catch (error) { diff.innerHTML = `<div class="error">${esc(error.message)}</div><div class="empty">请选择其他阶段或修正源码</div>`; setStatus('编译失败', true); }
    }
    async function compile() {
      setStatus('正在编译…'); document.querySelector('#compile').disabled = true;
      try {
        const response = await fetch('/api/compile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({source:source.value, opt:Number(document.querySelector('#opt').value)}) });
        const data = await response.json(); if (!response.ok) throw new Error(data.error || '编译失败'); stages = data.stages; count.textContent = `${stages.length} stages`; renderPipeline(); setStatus('编译完成');
        const first = stages[0]; if (first) await selectStage(first, pipeline.querySelector('.stage'));
      } catch (error) { pipeline.innerHTML = `<div class="error">${esc(error.message)}</div>`; count.textContent = '编译失败'; setStatus('编译失败', true); }
      finally { document.querySelector('#compile').disabled = false; }
    }
    document.querySelector('#compile').onclick = compile;
    document.querySelector('#opt').onchange = () => { if (stages.length) compile(); };
    source.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); compile(); } });
    compile();
  </script>
</body>
</html>
